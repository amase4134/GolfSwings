[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "golf-swing-cv"
version = "0.1.0"
description = "Golf swing computer vision tools — session video splitter and analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.8",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "matplotlib>=3.8"]
viz = ["matplotlib>=3.8"]

[project.scripts]
golf-swing-split = "golf_swing_cv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
